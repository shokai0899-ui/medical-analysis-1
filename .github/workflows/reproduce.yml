name: reproduce-analysis

# push / PR のたびに、クリーン環境で全分析を実行して再現性を検証する。
# 生成された図は成果物(artifact)としてダウンロード可能にする。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese fonts (so figures render CJK)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all analyses
        run: |
          python src/01_total_vs_expedited.py
          python src/02_expedited_vs_nonexpedited.py
          python src/03_structural_change.py

      - name: Upload regenerated figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/*.png
